<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CineTrack — six candidates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Josefin+Sans:wght@300;400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Anton&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9d9d4; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 480px); gap: 18px; width: max-content; }
  .thumb { width: 480px; height: 300px; position: relative; overflow: hidden; outline: 1px solid rgba(0,0,0,.15); }
  .label { display: none; }
  .cell { width: 480px; }
  figcaption { font: 500 10px/1 "Inter", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #333; padding: 7px 0 0; }
  img.p { object-fit: cover; display: block; }

  /* 1 · Palace */
  .t1 { background: #17352F; color: #F3EAD4; padding: 14px; font-family: "Josefin Sans", sans-serif; }
  .t1 .frame { position: absolute; inset: 7px; border: 1px solid #C9A24A; }
  .t1 .frame2 { position: absolute; inset: 10px; border: 1px solid #C9A24A; opacity: .5; }
  .t1 .sun { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); }
  .t1 .mast { position: relative; text-align: center; font: 700 26px/1 "Cinzel", serif; letter-spacing: .18em; color: #C9A24A; margin-top: 10px; }
  .t1 .sub { position: relative; text-align: center; font-size: 6.5px; letter-spacing: .22em; color: #F3EAD4; margin-top: 4px; }
  .t1 .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; position: relative; }
  .t1 .col { border: 1px solid rgba(201,162,74,.6); padding: 5px; }
  .t1 .col h4 { font: 600 7px/1 "Cinzel", serif; letter-spacing: .12em; color: #C9A24A; text-align: center; margin-bottom: 4px; }
  .t1 .col img { width: 100%; height: 92px; object-fit: cover; }
  .t1 .col .n { font-size: 6.5px; text-align: center; margin-top: 3px; color: #E8DCC0; }
  .t1 .strip { position: absolute; left: 0; right: 0; bottom: 0; background: #9E2A1D; text-align: center; padding: 6px 0; font-size: 7px; letter-spacing: .18em; color: #F3EAD4; }

  /* 2 · Cinema Notebook */
  .t2 { background: #FAF7F0; color: #1C1B19; padding: 12px 16px; font-family: "Inter", sans-serif; }
  .t2 .nav { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #DCD6C9; padding-bottom: 5px; }
  .t2 .nav b { font: 600 15px/1 "Fraunces", serif; }
  .t2 .nav span { font-size: 6.5px; letter-spacing: .1em; color: #6B665C; }
  .t2 .body { display: flex; gap: 14px; margin-top: 10px; }
  .t2 .hero { display: flex; gap: 10px; }
  .t2 .hero img { width: 96px; height: 140px; object-fit: cover; }
  .t2 .hero .k { font-size: 6px; letter-spacing: .14em; color: #A33B2B; }
  .t2 .hero h2 { font: 600 19px/1.02 "Fraunces", serif; margin-top: 3px; letter-spacing: -.01em; }
  .t2 .hero .m { font-size: 7px; color: #6B665C; margin-top: 4px; line-height: 1.6; }
  .t2 .shelf { flex: 1; }
  .t2 .shelf h3 { font-size: 6px; letter-spacing: .16em; color: #6B665C; border-bottom: 1px solid #DCD6C9; padding-bottom: 3px; }
  .t2 .row { display: flex; gap: 6px; margin-top: 5px; }
  .t2 .row img { width: 38px; height: 56px; object-fit: cover; }
  .t2 .tabs { position: absolute; left: 16px; bottom: 10px; display: flex; gap: 12px; font-size: 6.5px; letter-spacing: .1em; color: #6B665C; }
  .t2 .tabs b { color: #A33B2B; }

  /* 3 · Index */
  .t3 { background: #FFF; color: #111; padding: 12px 14px; font-family: "Inter", sans-serif; }
  .t3 .mast { font: 700 34px/.9 "Inter", sans-serif; letter-spacing: -.04em; }
  .t3 .rule { height: 3px; background: #D2352C; margin-top: 5px; width: 100%; }
  .t3 .cols { display: flex; gap: 14px; margin-top: 8px; }
  .t3 .list { width: 190px; }
  .t3 .item { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #E2E0DA; padding: 4px 0; }
  .t3 .item em { font: 400 6.5px/1 "JetBrains Mono", monospace; color: #D2352C; font-style: normal; }
  .t3 .item b { font: 600 8px/1 "Inter", sans-serif; flex: 1; margin-left: 6px; }
  .t3 .item span { font: 400 6px/1 "JetBrains Mono", monospace; color: #777; }
  .t3 .wall { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .t3 .wall img { width: 100%; height: 74px; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .t3 .foot { position: absolute; left: 14px; bottom: 8px; font: 400 6.5px/1 "JetBrains Mono", monospace; letter-spacing: .1em; color: #777; }

  /* 4 · Letterboxd */
  .t4 { background: #14181C; color: #9AB; padding: 10px 14px; font-family: "Inter", sans-serif; }
  .t4 .top { display: flex; justify-content: space-between; align-items: baseline; }
  .t4 .top b { color: #FFF; font: 700 11px/1 "Inter", sans-serif; letter-spacing: .06em; }
  .t4 .top span { font-size: 6px; color: #00E054; letter-spacing: .12em; }
  .t4 .tabs { font-size: 6.5px; color: #9AB; margin-top: 7px; display: flex; gap: 10px; }
  .t4 .tabs b { color: #FFF; border-bottom: 1px solid #00E054; }
  .t4 .wall { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 7px; }
  .t4 .wall img { width: 100%; height: 82px; object-fit: cover; }
  .t4 .badge { position: absolute; right: 14px; bottom: 10px; font-size: 6px; color: #FF8000; letter-spacing: .1em; }

  /* 5 · Terminal-Core */
  .t5 { background: #0B0D14; color: #F2F0EF; padding: 12px 14px; font-family: "JetBrains Mono", monospace; }
  .t5 .top { font-size: 6.5px; color: #7C5CFF; letter-spacing: .1em; }
  .t5 .cmd { font-size: 6.5px; color: #F2F0EF; margin-top: 4px; }
  .t5 .cmd b { color: #7C5CFF; }
  .t5 .bento { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .t5 .cell { border: 1px solid #222838; background: #10141E; padding: 6px; }
  .t5 .cell .k { font-size: 5.5px; color: #8B93A7; letter-spacing: .12em; }
  .t5 .cell .v { font-size: 16px; font-weight: 600; margin-top: 3px; }
  .t5 .cell .v.violet { color: #7C5CFF; }
  .t5 .posters { display: flex; gap: 4px; margin-top: 7px; }
  .t5 .posters img { width: 34px; height: 50px; object-fit: cover; opacity: .85; }
  .t5 .cube { position: absolute; right: 16px; bottom: 12px; width: 46px; height: 46px; transform: rotateX(55deg) rotateZ(45deg); border: 1px solid #7C5CFF; box-shadow: 6px 6px 0 rgba(124,92,255,.25); }

  /* 6 · Collins */
  .t6 { background: #0F0F0F; color: #F2EDE4; padding: 12px 14px; font-family: "Inter", sans-serif; }
  .t6 .k { font-size: 6px; letter-spacing: .2em; color: #E63B2E; }
  .t6 h1 { font: 400 44px/.88 "Anton", sans-serif; letter-spacing: -.01em; margin-top: 4px; }
  .t6 h1 span { color: #E63B2E; }
  .t6 .still { position: absolute; right: 0; top: 0; width: 168px; height: 300px; }
  .t6 .still img { width: 100%; height: 100%; object-fit: cover; }
  .t6 .still::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0F0F0F 0%, transparent 45%); }
  .t6 .list { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; font-size: 6px; letter-spacing: .08em; color: #B9B3A8; }
  .t6 .list b { color: #F2EDE4; display: block; font-size: 8px; }
</style>
</head>
<body>
<div class="grid">

  <!-- 1 Palace -->
  <figure class="cell"><div class="thumb t1">
    <div class="frame"></div><div class="frame2"></div>
    <svg class="sun" width="120" height="60" viewBox="0 0 120 60">
      <g stroke="#C9A24A" stroke-width="1" opacity="0.55">
        <path d="M60 60 L60 4"/><path d="M60 60 L30 10"/><path d="M60 60 L90 10"/>
        <path d="M60 60 L12 26"/><path d="M60 60 L108 26"/><path d="M60 60 L4 48"/><path d="M60 60 L116 48"/>
      </g>
      <circle cx="60" cy="52" r="16" fill="none" stroke="#C9A24A" opacity="0.7"/>
    </svg>
    <div class="mast">CINETRACK</div>
    <div class="sub">PROGRAMA DE CINE · 8 PELÍCULAS</div>
    <div class="cols">
      <div class="col"><h4>TO WATCH</h4><img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt2582802&h=400"><div class="n">Whiplash · 2014</div></div>
      <div class="col"><h4>WATCHING</h4><img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1375666&h=400"><div class="n">Inception · 2010</div></div>
      <div class="col"><h4>WATCHED</h4><img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0068646&h=400"><div class="n">The Godfather · 1972</div></div>
    </div>
    <div class="strip">TO WATCH 3 &nbsp;·&nbsp; WATCHING 2 &nbsp;·&nbsp; WATCHED 3</div>
    </div><figcaption>01 · Shanghai Deco — Palace</figcaption></figure>

  <!-- 2 Cinema Notebook -->
  <figure class="cell"><div class="thumb t2">
    <div class="nav"><b>CineTrack</b><span>SEARCH &nbsp;·&nbsp; LISTS &nbsp;·&nbsp; PROFILE</span></div>
    <div class="body">
      <div class="hero">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1375666&h=400">
        <div>
          <div class="k">WATCHING</div>
          <h2>Inception</h2>
          <div class="m">2010 · Christopher Nolan<br>Sci-Fi, Action · 148 min<br>★★★★★</div>
        </div>
      </div>
      <div class="shelf">
        <h3>TO WATCH — 3</h3>
        <div class="row">
          <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt2582802&h=400">
          <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt6751668&h=400">
          <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1160419&h=400">
        </div>
        <h3 style="margin-top:8px">WATCHED — 3</h3>
        <div class="row">
          <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0111161&h=400">
          <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0068646&h=400">
          <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0110912&h=400">
        </div>
      </div>
    </div>
    <div class="tabs"><b>ALL 8</b><span>TO WATCH 3</span><span>WATCHING 2</span><span>WATCHED 3</span></div>
    </div><figcaption>02 · MUBI — Cinema Notebook</figcaption></figure>

  <!-- 3 Index -->
  <figure class="cell"><div class="thumb t3">
    <div class="mast">CINETRACK</div>
    <div class="rule"></div>
    <div class="cols">
      <div class="list">
        <div class="item"><em>01</em><b>Inception</b><span>2010</span></div>
        <div class="item"><em>02</em><b>Interstellar</b><span>2014</span></div>
        <div class="item"><em>03</em><b>Whiplash</b><span>2014</span></div>
        <div class="item"><em>04</em><b>Parasite</b><span>2019</span></div>
        <div class="item"><em>05</em><b>Dune</b><span>2021</span></div>
        <div class="item"><em>06</em><b>Pulp Fiction</b><span>1994</span></div>
      </div>
      <div class="wall">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1375666&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0816692&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt2582802&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt6751668&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1160419&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0110912&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0111161&h=400">
        <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0068646&h=400">
      </div>
    </div>
    <div class="foot">ALL 8 / TO WATCH 3 / WATCHING 2 / WATCHED 3</div>
    </div><figcaption>03 · Experimental Jetset — Index</figcaption></figure>

  <!-- 4 Letterboxd -->
  <figure class="cell"><div class="thumb t4">
    <div class="top"><b>CINETRACK</b><span>● WATCHING NOW</span></div>
    <div class="tabs"><b>ALL</b><span>TO WATCH</span><span>WATCHING</span><span>WATCHED</span></div>
    <div class="wall">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1375666&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0816692&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt2582802&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt6751668&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1160419&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0111161&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0068646&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0110912&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0110912&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt6751668&h=400">
    </div>
    <div class="badge">★★★★★ 3 WATCHED</div>
    </div><figcaption>04 · Letterboxd — Poster Wall</figcaption></figure>

  <!-- 5 Terminal -->
  <figure class="cell"><div class="thumb t5">
    <div class="top">CINETRACK // PROJECTION CONSOLE</div>
    <div class="cmd"><b>&gt;</b> list --status watching</div>
    <div class="bento">
      <div class="cell"><div class="k">ALL</div><div class="v">08</div></div>
      <div class="cell"><div class="k">TO WATCH</div><div class="v violet">03</div></div>
      <div class="cell"><div class="k">WATCHING</div><div class="v">02</div></div>
    </div>
    <div class="posters">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1375666&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0816692&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0111161&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0068646&h=400">
      <img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt0110912&h=400">
    </div>
    <div class="cube"></div>
    </div><figcaption>05 · Terminal-Core — Projection Console</figcaption></figure>

  <!-- 6 Collins -->
  <figure class="cell"><div class="thumb t6">
    <div class="still"><img class="p" src="https://img.omdbapi.com/?apikey=ec83d8bc&i=tt1375666&h=400"></div>
    <div class="k">NOW WATCHING · 02 OF 08</div>
    <h1>THE<br>LIST IS<br><span>THE FILM.</span></h1>

      <div><b>INCEPTION</b>WATCHING</div>
      <div><b>WHIPLASH</b>TO WATCH</div>
      <div><b>GODFATHER</b>WATCHED</div>
    </div>
    </div><figcaption>06 · Collins — The List Is the Film</figcaption></figure>

</div>
</body>
</html>
